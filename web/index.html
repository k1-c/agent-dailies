<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>agent dailies</title>
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header class="bar">
			<button class="side-toggle" id="side-toggle" type="button" aria-label="Sidebar">☰</button>
			<a class="brand" href="#" data-action="top" aria-label="agent dailies">
				<img src="/icon.svg" alt="" width="22" height="22" />
				<span>agent dailies</span>
			</a>
			<nav class="modes" id="modes" aria-label="Views">
				<button type="button" data-mode="dailies"><span class="mode-label"></span><span class="mode-count"></span></button>
				<button type="button" data-mode="devlog"><span class="mode-label"></span><span class="mode-count"></span></button>
			</nav>
			<span class="scope-title" id="scope-title"></span>
			<button class="open-questions" id="open-questions" type="button" hidden></button>
			<div class="status" id="status" title="">
				<span class="dot"></span>
				<span class="status-text" id="status-text"></span>
			</div>
		</header>

		<button class="fresh" id="fresh" type="button" hidden></button>

		<div class="layout">
			<aside class="sidebar" id="sidebar">
				<input class="search" id="search" type="search" autocomplete="off" />
				<nav class="tree" id="tree" aria-label="History"></nav>
			</aside>
			<div class="content">
				<section class="issue-card" id="issue-card" hidden></section>
				<main id="feed" class="feed" aria-live="polite"></main>
				<div class="more" id="more" hidden><button type="button" id="more-button"></button></div>
				<section class="empty" id="empty" hidden></section>
			</div>
		</div>
		<div class="side-scrim" id="side-scrim"></div>

		<footer class="keys" id="keys"></footer>

		<div class="lightbox" id="lightbox" hidden>
			<div class="lightbox-stage" id="lightbox-stage"></div>
			<div class="lightbox-caption" id="lightbox-caption"></div>
			<button class="lightbox-close" type="button" id="lightbox-close" aria-label="Close">×</button>
		</div>

		<script src="/i18n.js"></script>
		<script src="/app.js"></script>
	</body>
</html>
